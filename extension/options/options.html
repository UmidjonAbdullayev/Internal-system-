<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay Sync — Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Amazon Relay Sync</h1>
    <p class="sub">API capture diagnostics (extension v1.4.0)</p>

    <section>
      <h2>Raw captures</h2>
      <p>
        The background keeps the last <strong>200</strong> JSON responses intercepted from
        <code>relay.amazon.com</code> (url, timestamp, body).
      </p>
      <p id="capture-stats" class="stats">Loading…</p>
      <button id="download-captures" type="button">Download raw captures</button>
      <p id="download-status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
