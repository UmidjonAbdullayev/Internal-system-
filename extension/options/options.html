<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay Sync — Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Amazon Relay Sync</h1>
    <p class="sub">Always-on entitiesV2 (extension v1.8.0) — per-tab filter bodies</p>

    <section>
      <h2>Raw captures</h2>
      <p>Last <strong>20</strong> entitiesV2 responses. Driver phone/email stripped.</p>
      <p id="capture-stats" class="stats">Loading…</p>
      <button id="download-captures" type="button">Download raw captures</button>
      <p id="download-status" class="status" aria-live="polite"></p>
    </section>

    <section>
      <h2>Always-on schedule</h2>
      <p class="hint">Minimums enforced: In Transit ≥45s, Upcoming ≥90s, History page1 ≥10min. ±10s jitter. ≥2s between requests.</p>
      <label>IN_TRANSIT interval (seconds)
        <input id="sched-in-transit" type="number" min="45" step="1" />
      </label>
      <label>UPCOMING interval (seconds)
        <input id="sched-upcoming" type="number" min="90" step="1" />
      </label>
      <label>HISTORY page-1 interval (minutes)
        <input id="sched-history" type="number" min="10" step="1" />
      </label>
      <button id="save-schedule" type="button">Save schedule</button>
      <p id="schedule-status" class="status" aria-live="polite"></p>
      <p id="template-status" class="stats"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
